name: plan-check

# Daily check of the API-Football plan. /status is free, so this costs no quota.
# Fails (and GitHub emails you) when live updates switch off.
on:
  schedule:
    - cron: "17 0 * * *"  # 00:17 UTC, just after the daily quota reset
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run python -m mercato.service_status
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
