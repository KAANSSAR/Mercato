[project]
name = "mercato"
version = "0.1.0"
description = "Football stats platform and transfer valuation engine"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
data = ["soccerdata>=1.8", "duckdb>=1.1"]
model = ["xgboost>=2.1", "shap>=0.46", "scikit-learn>=1.5"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
