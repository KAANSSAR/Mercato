name: gfr

# Daily snapshot of Global Football Rankings' league and club ratings (they update with
# every result). Two page loads a day. Fails (and GitHub emails you) if the layout changes.
on:
  schedule:
    - cron: "41 3 * * *"  # 03:41 UTC daily, after the night's results
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra scrape
      - run: uv run playwright install --with-deps chromium
      - run: uv run python -m mercato.sources.gfr
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
